name: tests

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_AUTHOR_NAME: conclave-ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: conclave-ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl jq perl python3 tmux
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # linux_x64 line of gitleaks_8.30.1_checksums.txt from the v8.30.1 release.
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | (cd "$tmp" && sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          gitleaks version | grep -qx '8.30.1'
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          bash -c '[[ ${BASH_VERSINFO[0]} -gt 4 || ( ${BASH_VERSINFO[0]} -eq 4 && ${BASH_VERSINFO[1]} -ge 4 ) ]]'
          command -v jq >/dev/null
          command -v git >/dev/null
          command -v tmux >/dev/null
          command -v perl >/dev/null
          echo "python $(python3 --version)"
          echo "bash ${BASH_VERSION}"
          echo "jq $(jq --version)"
          echo "git $(git --version)"
          echo "tmux $(tmux -V)"
          echo "perl $(perl -V:version)"

      - name: Run the suite
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(scripts/test-*.py scripts/test-*.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "no scripts/test-*.py or scripts/test-*.sh files" >&2
            exit 1
          fi
          IFS=$'\n'
          tests=($(printf '%s\n' "${tests[@]}" | LC_ALL=C sort))
          unset IFS

          passed=0
          failed=0
          fail_names=()
          for test_path in "${tests[@]}"; do
            if [[ "$test_path" == *.py ]]; then
              cmd=(python3 "$test_path")
            else
              cmd=(bash "$test_path")
            fi
            echo "RUN ${cmd[*]}"
            set +e
            "${cmd[@]}"
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "PASS ${test_path}"
              passed=$((passed + 1))
            else
              echo "FAIL ${test_path} exit ${rc}"
              failed=$((failed + 1))
              fail_names+=("$test_path")
            fi
          done

          echo "SUMMARY passed=${passed} failed=${failed} total=${#tests[@]}"
          if [[ "$failed" -ne 0 ]]; then
            printf 'FAILED %s\n' "${fail_names[@]}"
            exit 1
          fi
